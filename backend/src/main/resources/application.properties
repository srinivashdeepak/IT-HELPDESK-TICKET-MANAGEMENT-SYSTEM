# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=it-helpdesk-system

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/it_helpdesk_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (256-bit HMAC key)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# File Upload Configuration (Multipart)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/attachments
app.upload.avatars=uploads/avatars

# Email SMTP Configuration (Configurable - graceful simulation if not configured)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@company.com
spring.mail.password=placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false

# SLA Scheduler
app.sla.check-rate-ms=60000

# Logging
logging.level.com.helpdesk=INFO
logging.level.org.springframework.security=WARN
